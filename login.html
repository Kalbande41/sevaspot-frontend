<script>
    // ==========================================
    // १. लॉगिन आणि ॲडमिन चेक
    // ==========================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.innerText = "तपासत आहे...";
        loginBtn.disabled = true;

        const identifier = document.getElementById('loginIdentifier').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        try {
            // 🔒 पायरी १: सर्वात आधी Supabase मधील admin_users टेबल तपासणे
            const { data: adminData } = await _supabase
                .from('admin_users')
                .select('*')
                .eq('username', identifier)
                .eq('password', password)
                .maybeSingle();

            if (adminData) {
                sessionStorage.setItem('QUICKID_ADMIN_SESSION', JSON.stringify({
                    id: adminData.id,
                    username: adminData.username,
                    role: 'admin'
                }));
                window.location.href = "admin.html";
                return;
            }

            // 👤 पायरी २: जर ॲडमिन नसेल, तर सामान्य युझर लॉगिन
            let userEmail = identifier;

            if (!identifier.includes('@')) {
                const cleanMobile = identifier.replace(/\D/g, ''); 
                
                const { data: userProfile } = await _supabase
                    .from('user_profiles')
                    .select('email')
                    .eq('mobile_number', cleanMobile)
                    .maybeSingle();

                if (!userProfile) {
                    throw new Error("हा मोबाईल नंबर नोंदणीकृत नाही. कृपया अचूक नंबर टाका.");
                }
                userEmail = userProfile.email;
            }

            // Supabase Auth लॉगिन
            const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                email: userEmail,
                password: password
            });

            if (authError) {
                throw new Error("ईमेल/मोबाईल नंबर किंवा पासवर्ड चुकीचा आहे.");
            }

            const userId = authData.user.id;

            // पायथन बॅकएंडवरून व्हॅलिडिटी चेक करणे
            const response = await fetch(`${BACKEND_URL}/check-validity`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId })
            });

            const result = await response.json();

            // 🟢 मुख्य बदल: प्लॅन ॲक्टिव्ह नसला तरीही युजरला एरर न देता थेट आत प्रवेश देणे.
            // (त्याची सर्व्हिस डेटाबेसमधील 'Inactive' स्टेट्समुळे आपोआप बंद राहील)
            sessionStorage.setItem('userId', userId);
            sessionStorage.setItem('username', userEmail);
            sessionStorage.setItem('expireDate', result.expire_date || "सेट नाही");
            
            window.location.href = "home.html";

        } catch (err) {
            alert("लॉगिन अयशस्वी: \n" + (err.message || "कृपया माहिती तपासा."));
            loginBtn.innerText = "लॉगिन करा";
            loginBtn.disabled = false;
        }
    });

    // ==========================================
    // २. थेट पासवर्ड रीसेट (Python API द्वारे)
    // ==========================================
    function openForgotModal() {
        document.getElementById('forgotModal').style.display = 'flex';
    }
    function closeForgotModal() {
        document.getElementById('forgotModal').style.display = 'none';
    }

    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const resetBtn = document.getElementById('resetBtn');
        resetBtn.innerText = "पासवर्ड बदलत आहे...";
        resetBtn.disabled = true;

        const mobile = document.getElementById('resetMobile').value.trim();
        const email = document.getElementById('resetEmail').value.trim().toLowerCase();
        const newPassword = document.getElementById('resetNewPassword').value.trim();

        try {
            // सर्वात आधी युजरचा ID डेटाबेसमधून शोधणे
            const { data: prof } = await _supabase
                .from('user_profiles')
                .select('id')
                .eq('mobile_number', mobile)
                .eq('email', email)
                .maybeSingle();

            if (!prof) {
                throw new Error("मोबाईल नंबर आणि ईमेल जुळत नाहीत. कृपया अचूक माहिती टाका.");
            }

            // Python Backend कडे पासवर्ड बदलण्यासाठी रिक्वेस्ट पाठवणे
            const response = await fetch(`${BACKEND_URL}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: prof.id, 
                    email: email, 
                    mobile: mobile, 
                    newPassword: newPassword 
                })
            });

            const resData = await response.json();

            if (resData.status === 'success') {
                alert("अभिनंदन! तुमचा पासवर्ड यशस्वीरीत्या बदलला आहे.\nकृपया आता नवीन पासवर्ड वापरून लॉगिन करा.");
                closeForgotModal();
                document.getElementById('loginPassword').value = newPassword;
            } else {
                throw new Error(resData.message || "सर्व्हर एरर.");
            }

        } catch (err) {
            alert("पासवर्ड रीसेट अयशस्वी: \n" + err.message);
        } finally {
            resetBtn.innerText = "पासवर्ड अपडेट करा";
            resetBtn.disabled = false;
        }
    });
</script>
