<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickIDPrint | सुरक्षित लॉगिन</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Supabase JS Library & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta',sans-serif; }
        
        :root {
            --primary: #123a8f;
            --primary-light: #2563eb;
            --orange: #f97316;
            --text-dark: #172554;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        body { 
            min-height: 100vh; 
            background: radial-gradient(circle at top left, #fff4b8 0%, transparent 30%), linear-gradient(135deg, #fffdf4 0%, #f1f6ff 100%); 
            display: flex; align-items: center; justify-content: center; 
            padding: 20px; color: var(--text-dark);
        }

        .login-card {
            background: #ffffff; width: 100%; max-width: 440px;
            border-radius: 24px; padding: 36px 32px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 45px rgba(18,58,143,0.08);
            text-align: center;
        }

        .logo-icon {
            width: 58px; height: 58px; border-radius: 16px;
            background: #fff5bf; color: var(--primary);
            font-size: 26px; display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid #fed7aa; margin-bottom: 14px;
        }

        .logo-text h1 { font-size: 26px; font-weight: 800; line-height: 1; }
        .blue { color: #123a8f; } .orange { color: #f97316; }
        .logo-text p { color: #64748b; font-size: 12px; font-weight: 600; margin-top: 4px; margin-bottom: 22px; }

        .field { text-align: left; margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
        
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 14px; color: #94a3b8; font-size: 15px; }
        .input-wrap input {
            width: 100%; height: 46px; border: 1.5px solid var(--border);
            border-radius: 12px; padding: 8px 14px 8px 42px;
            font-size: 15px; outline: none; font-weight: 600; transition: 0.2s;
        }
        .input-wrap input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn-submit {
            width: 100%; height: 48px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #123a8f, #2563eb);
            color: white; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: 0.2s; margin-top: 10px;
            box-shadow: 0 8px 20px rgba(18,58,143,0.25);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(18,58,143,0.35); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        .error-msg {
            background: #fee2e2; color: #b91c1c; padding: 10px 14px;
            border-radius: 10px; font-size: 13px; font-weight: 700;
            margin-bottom: 16px; display: none; text-align: left;
        }

        .footer-links { margin-top: 22px; font-size: 13px; color: #64748b; font-weight: 600; }
        .footer-links a { color: #2563eb; text-decoration: none; font-weight: 700; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon"><i class="fas fa-id-card"></i></div>
        <div class="logo-text">
            <h1><span class="blue">Quick</span><span class="orange">ID</span><span class="blue">Print</span></h1>
            <p>पोर्टल सुरक्षित प्रवेश</p>
        </div>

        <div id="errorAlert" class="error-msg"></div>

        <form onsubmit="handleSmartLogin(event)">
            <div class="field">
                <label>User ID (मोबाईल नंबर / Username)</label>
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="usernameInput" placeholder="उदा. admin किंवा 9403XXXXXX" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label>Password (पासवर्ड)</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> लॉगिन करा
            </button>
        </form>

        <div class="footer-links">
            नवीन खाते तयार करायचे आहे का? <a href="signup.html">येथे नोंदणी करा</a>
        </div>
    </div>

    <script>
        async function handleSmartLogin(event) {
            event.preventDefault();
            
            const userOrMobile = document.getElementById("usernameInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();
            const submitBtn = document.getElementById("submitBtn");
            const errorBox = document.getElementById("errorAlert");

            errorBox.style.display = "none";
            submitBtn.innerText = "तपासत आहे...";
            submitBtn.disabled = true;

            try {
                // ========================================================
                // 🔍 पायरी १: आधी Supabase मधील admin_users टेबल तपासणे
                // ========================================================
                const { data: adminData, error: adminErr } = await _supabase
                    .from('admin_users')
                    .select('*')
                    .eq('username', userOrMobile)
                    .eq('password', password)
                    .eq('is_active', true)
                    .maybeSingle();

                // जर ॲडमिन सापडला तर थेट admin.html उघडणे!
                if (adminData) {
                    console.log("Master Admin Authenticated!");
                    
                    // ॲडमिन सेशन सेव्ह करणे
                    sessionStorage.setItem('QUICKID_ADMIN_SESSION', JSON.stringify({
                        id: adminData.id,
                        username: adminData.username,
                        name: adminData.admin_name,
                        role: 'admin',
                        loginTime: new Date().getTime()
                    }));

                    window.location.href = "admin.html";
                    return;
                }

                // ========================================================
                // 👤 पायरी २: जर ॲडमिन नसेल, तर सामान्य दुकानदार लॉगिन
                // ========================================================
                let emailToLogin = userOrMobile;
                if (!userOrMobile.includes('@')) {
                    // मोबाईल नंबर असल्यास ईमेल शोधणे
                    const { data: profile } = await _supabase
                        .from('user_profiles')
                        .select('email')
                        .eq('mobile_number', userOrMobile)
                        .maybeSingle();

                    if (profile && profile.email) {
                        emailToLogin = profile.email;
                    }
                }

                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: emailToLogin,
                    password: password
                });

                if (error) throw error;

                // दुकानदाराला home.html कडे पाठवणे
                sessionStorage.setItem('userId', data.user.id);
                window.location.href = "home.html";

            } catch (err) {
                errorBox.innerText = err.message || "लॉगिन अयशस्वी! आयडी किंवा पासवर्ड तपासा.";
                errorBox.style.display = "block";
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> लॉगिन करा';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
