<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>खात्यात प्रवेश करा • Login</title>
  <style>
    /* बेसिक रिसेट आणि फॉन्ट */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f8fafc; /* स्वच्छ फिकट बॅकग्राउंड */
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    /* लॉगिन कार्ड बॉक्स */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: 2.25rem;
    }

    /* हेडर आणि लोगो */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-badge {
      width: 48px;
      height: 48px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-badge svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.35rem;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
    }

    /* इनपुट फिल्ड्स */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.875rem;
      color: #94a3b8;
      display: flex;
      pointer-events: none;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .form-input {
      width: 100%;
      height: 2.75rem;
      padding: 0 0.875rem 0 2.625rem;
      font-size: 0.9375rem;
      color: #0f172a;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    /* पासवर्ड दाखवणे/लपवणे आयकॉन */
    .toggle-password {
      position: absolute;
      right: 0.875rem;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      padding: 0;
    }

    .toggle-password:hover {
      color: #0f172a;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* ऑप्शन्स: माझी नोंद ठेवा आणि पासवर्ड विसरलात */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input {
      accent-color: #2563eb;
      cursor: pointer;
    }

    .forgot-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* मुख्य लॉगिन बटन */
    .btn-submit {
      width: 100%;
      height: 2.75rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* फुटर */
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }

    .footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Header -->
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="title">खात्यात प्रवेश करा</h1>
      <p class="subtitle">तुमचा ईमेल व पासवर्ड टाकून लॉगिन करा</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="submitLogin(event)">
      <!-- Email / User ID -->
      <div class="form-group">
        <label for="userEmail" class="form-label">ईमेल किंवा युझर आयडी</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input 
            type="text" 
            id="userEmail" 
            class="form-input" 
            placeholder="नाव@example.com" 
            required 
            autocomplete="username"
          >
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="userPassword" class="form-label">पासवर्ड</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="userPassword" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" class="toggle-password" onclick="togglePassword()">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Options -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>माझी नोंद ठेवा</span>
        </label>
        <a href="#" class="forgot-link">पासवर्ड विसरलात?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">
        <span>लॉगिन करा</span>
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </form>

    <!-- Footer -->
    <div class="footer">
      खाते नाही का? <a href="#">नवीन खाते तयार करा</a>
    </div>
  </div>

  <script>
    // पासवर्ड पाहण्यासाठी आयकॉनवर क्लिक केल्यास toggle करणे
    function togglePassword() {
      const pwd = document.getElementById('userPassword');
      pwd.type = (pwd.type === 'password') ? 'text' : 'password';
    }

    // लॉगिन फॉर्म सबमिट फंक्शन
    function submitLogin(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;
      alert("स्वागत आहे! " + email + " लॉगिन यशस्वी झाले.");
    }
  </script>
</body>
</html>
