<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhaar Card Service - QuickIDPrint</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth-guard.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 20px; text-align: center; }
        
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 550px; margin: auto; position: relative; padding-bottom: 30px; }
        .back-link { position: absolute; top: 20px; right: 20px; color: #2563eb; text-decoration: none; font-weight: 600; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }

        h2 { color: #2563eb; margin-bottom: 25px; border-bottom: 2px solid #2563eb; padding-bottom: 10px; display: inline-block; font-size: 24px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; outline: none; }
        
        /* सिम्पल ब्राइटनेस कंट्रोल */
        .slider-group { background: #fff7ed; border: 1px solid #fed7aa; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .slider-group label { display: flex; justify-content: space-between; font-weight: bold; color: #ea580c; font-size: 14px; margin-bottom: 8px; }
        .slider-group input[type=range] { width: 100%; cursor: pointer; height: 6px; -webkit-appearance: none; background: #cbd5e1; border-radius: 5px; outline: none; }
        .slider-group input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #ea580c; cursor: pointer; }
        
        .btn-process { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-process:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3); }
        
        .error { color: #dc2626; font-weight: bold; display: none; margin-top: 15px; background: #fee2e2; padding: 10px; border-radius: 6px; }
        .success { color: #166534; font-weight: bold; display: none; margin-top: 15px; background: #dcfce7; padding: 10px; border-radius: 6px; border: 1px solid #22c55e; }
    </style>
</head>
<body>

    <div class="container">
        <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i> डॅशबोर्ड</a>

        <h2><i class="fas fa-fingerprint"></i> स्मार्ट आधार प्रिंट</h2>
        
        <form id="cardForm" onsubmit="processAndDownload(event)">
            <div class="form-group">
                <label>पेपरची साईझ निवडा:</label>
                <select id="printSize">
                    <option value="4x6">4x6 Photo Paper (Smart Crop)</option>
                    <option value="A4">A4 Full Size Paper</option>
                </select>
            </div>

            <div class="form-group">
                <label>आधारची PDF फाईल निवडा:</label>
                <input type="file" id="pdfFile" accept="application/pdf" required>
            </div>

            <div class="form-group">
                <label>PDF पासवर्ड (असल्यास):</label>
                <input type="password" id="pdfPassword" placeholder="उदा. नाव 4 अक्षर + जन्मवर्ष">
            </div>

            <!-- थेट फॉर्ममध्येच ब्राइटनेस सेट करण्याची सुविधा -->
            <div class="slider-group">
                <label>फोटो ब्राइटनेस (Auto Clear): <span id="valBright">110%</span></label>
                <input type="range" id="rangeBrightness" min="80" max="150" value="110" oninput="document.getElementById('valBright').innerText = this.value + '%'">
                <small style="color:#64748b; font-size:12px; display:block; margin-top:5px;">(फोटो खूपच काळपट असल्यास थोडे वाढवा, अन्यथा असेच राहू द्या.)</small>
            </div>

            <button type="submit" id="btnProcess" class="btn-process">
                <i class="fas fa-download"></i> प्रोसेस आणि डाऊनलोड करा
            </button>
            
            <p id="errorMsg" class="error"></p>
            <p id="successMsg" class="success"><i class="fas fa-check-circle"></i> PDF यशस्वीरीत्या डाऊनलोड झाली!</p>
        </form>
    </div>

    <script>
        async function processAndDownload(e) {
            e.preventDefault();
            
            let userId = sessionStorage.getItem('userId');
            const btn = document.getElementById('btnProcess');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> फाईल प्रोसेस होत आहे...";
            btn.disabled = true;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const formData = new FormData();
            formData.append('pdfFile', document.getElementById('pdfFile').files[0]);
            formData.append('password', document.getElementById('pdfPassword').value.trim());
            formData.append('size', document.getElementById('printSize').value);
            formData.append('cardName', 'Aadhaar'); 
            formData.append('brightness', document.getElementById('rangeBrightness').value);
            formData.append('userId', userId);

            try {
                const response = await fetch(`${BACKEND_URL}/api/services/process-card`, {
                    method: 'POST',
                    body: formData
                });

                if(response.ok) {
                    const data = await response.json();
                    
                    // 🟢 थेट डाऊनलोड लॉजिक
                    const linkSource = `data:application/pdf;base64,${data.pdf_base64}`;
                    const downloadLink = document.createElement("a");
                    downloadLink.href = linkSource;
                    downloadLink.download = `QuickIDPrint_Aadhaar_${document.getElementById('printSize').value}_${Date.now()}.pdf`;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    
                    successMsg.style.display = 'block';
                    btn.innerHTML = "<i class='fas fa-check'></i> काम पूर्ण झाले";
                    
                    // डाऊनलोड झाल्यानंतर डॅशबोर्डवर परत जाणे
                    setTimeout(() => { window.location.href = "home.html"; }, 2000);

                } else {
                    const errData = await response.json();
                    errorMsg.innerText = "त्रुटी: " + (errData.error || "प्रोसेसिंग पूर्ण होऊ शकले नाही.");
                    errorMsg.style.display = 'block';
                    btn.innerHTML = "<i class='fas fa-download'></i> प्रोसेस आणि डाऊनलोड करा";
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = "नेटवर्क एरर! सर्व्हरशी संपर्क होऊ शकला नाही.";
                errorMsg.style.display = 'block';
                btn.innerHTML = "<i class='fas fa-download'></i> प्रोसेस आणि डाऊनलोड करा";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
